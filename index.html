<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GemChess Academy | Master the Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            --primary: #2563eb; 
            --secondary: #3b82f6;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-light);
            color: #1e293b;
            overflow-x: hidden; 
        }

        /* --- Dynamic Background Animations --- */
        .floating-piece {
            position: absolute;
            z-index: 0;
            opacity: 0.15;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none;
            animation: float-around 25s infinite linear;
        }

        @keyframes float-around {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, 50px) rotate(10deg); }
            66% { transform: translate(-20px, 20px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .section-container {
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .btn-premium {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        /* --- Circular Loader --- */
        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .circle-spin {
            width: 80px;
            height: 80px;
            border: 8px solid #f3f3f3;
            border-top: 8px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-weight: 800;
            color: var(--primary);
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #mobile-menu {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #mobile-menu.active {
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="circle-spin"></div>
        <p class="loading-text">LOADING GEM CHESS...</p>
    </div>

    <div id="mobile-menu" class="fixed inset-0 z-[1001] bg-white flex flex-col items-center justify-center gap-8 md:hidden">
        <button onclick="toggleMenu()" class="absolute top-8 right-8 text-3xl text-slate-800"><i class="fas fa-times"></i></button>
        <a href="#puzzles" onclick="toggleMenu()" class="text-2xl font-bold">Daily Tactics</a>
        <a href="book.html" onclick="toggleMenu()" class="text-2xl font-bold">Workbooks</a>
        <a href="engine.html" onclick="toggleMenu()" class="text-2xl font-bold">Gem Engine</a>
        <a href="arena.html" onclick="toggleMenu()" class="btn-premium text-white px-10 py-4 rounded-full">Enter Arena</a>
    </div>

    <nav class="glass-nav sticky top-0 z-[999] px-6 md:px-12 py-5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-xl text-white transform -rotate-6"><i class="fas fa-chess-queen text-xl"></i></div>
            <span class="text-2xl font-extrabold tracking-tighter">GEM<span class="text-blue-600">CHESS</span></span>
        </div>
        <div class="hidden md:flex gap-10 font-bold text-slate-600 items-center">
            <a href="#puzzles" class="hover:text-blue-600 transition-colors">Daily Tactics</a>
            <a href="book.html" class="hover:text-blue-600 transition-colors">Workbooks</a>
            <a href="engine.html" class="hover:text-blue-600 transition-colors">Gem Engine</a>
            <a href="arena.html" class="btn-premium text-white px-6 py-2.5 rounded-full">Enter Arena</a>
        </div>
        <button onclick="toggleMenu()" class="md:hidden text-2xl text-slate-800"><i class="fas fa-bars"></i></button>
    </nav>

    <header class="relative px-6 py-20 md:py-32 overflow-hidden bg-white">
        <i class="fas fa-chess-rook floating-piece text-blue-500 text-8xl" style="top: 10%; left: 10%;"></i>
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-16 items-center relative z-10">
            <div data-aos="fade-right">
                <span class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-widest border border-blue-100">Official Academy 2026</span>
                <h1 class="text-6xl md:text-8xl font-black text-slate-900 mt-6 leading-tight">
                    Checkmate <br><span class="text-blue-600 underline decoration-blue-200">The Ordinary.</span>
                </h1>
                <p class="text-slate-500 text-xl mt-8 mb-10 leading-relaxed max-w-lg">
                    Elite 1-on-1 coaching designed to transform your strategic thinking. 
                </p>
                <div class="flex gap-4">
                    <a href="https://wa.me/2348149435262" class="btn-premium text-white px-10 py-5 rounded-2xl font-black text-lg">Book Training</a>
                </div>
            </div>
            <div class="relative" data-aos="zoom-in-left">
                <div class="absolute -inset-4 bg-blue-400 rounded-[3rem] blur-3xl opacity-20"></div>
                <img src="1775485871233.jpg" alt="Schoolboy playing chess" 
                     class="relative rounded-[2.5rem] shadow-2xl border-[12px] border-white transform hover:rotate-1 transition-transform duration-500 w-full object-cover">
            </div>
        </div>
    </header>

    <section id="puzzles" class="py-24 px-6 bg-white">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-4xl font-black mb-12">Solve Today's Tactical Puzzle</h2>
            <div class="rounded-[2.5rem] overflow-hidden shadow-3xl border-[12px] border-slate-50" data-aos="zoom-in">
                <iframe src="https://lichess.org/training/frame?theme=ic&bg=light" style="width: 100%; height: 600px;" frameborder="0"></iframe>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        function toggleMenu() { document.getElementById('mobile-menu').classList.toggle('active'); }

        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                if (!sessionStorage.getItem('welcomeSeen')) { triggerWelcome(); }
            }, 1500);
        });

        AOS.init({ duration: 1000, once: true });

        function triggerWelcome() {
            Swal.fire({
                title: 'Welcome to GemChess!',
                text: 'Are you ready to become a Grandmaster?',
                // POPUP IMAGE REPLACED HERE
                imageUrl: '1775485871233.jpg',
                imageWidth: 400,
                confirmButtonText: 'Chat with Coach',
                confirmButtonColor: '#2563eb',
                showCancelButton: true,
                cancelButtonText: 'Browse Website',
                background: '#ffffff',
                customClass: { popup: 'rounded-[2rem]' }
            }).then((result) => {
                sessionStorage.setItem('welcomeSeen', 'true');
                if (result.isConfirmed) {
                    window.location.href = "https://wa.me/2348149435262?text=Hello! I'm ready to start training.";
                }
            })
        }
    </script>
</body>
</html>
